
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - JobPortal</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>


    <!-- =========================
         NAVIGATION BAR
    ========================== -->

    <nav class="navbar">

        <div class="logo">
            JobPortal
        </div>

        <div class="nav-links">

            <a href="/">
                Home
            </a>

            <a href="#">
                Jobs
            </a>

            <a href="/login">
                Login
            </a>

            <a href="/register">
                Register
            </a>

        </div>

    </nav>


    <!-- =========================
         REGISTER FORM
    ========================== -->

    <section class="form-section">

        <div class="form-container">

            <h2>
                Create Your Account
            </h2>


            <!-- Message -->

            {% if message %}

                <p class="message">
                    {{ message }}
                </p>

            {% endif %}


            <!-- Register Form -->

            <form method="POST">


                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required>


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required>


                <button type="submit">
                    Create Account
                </button>

            </form>


            <!-- Login Link -->

            <p class="form-link">

                Already have an account?

                <a href="/login">
                    Login
                </a>

            </p>


        </div>

    </section>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            © 2026 JobPortal. All Rights Reserved.
        </p>

    </footer>


</body>

</html>
